name: Build with Maven and Docker

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+**'
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"
          cache: maven

      - name: Build with Maven
        run: mvn -B install

      - name: Build Directory Sync Service image
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -t samply/directory_sync_service \
            .

      - name: Build data-loader image
        working-directory: ci/data_loader
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -t samply/data-loader \
            .

      - name: Export integration-test images
        run: |
          mkdir -p docker-images

          docker save \
            samply/directory_sync_service \
            -o docker-images/directory-sync-service.tar

          docker save \
            samply/data-loader \
            -o docker-images/data-loader.tar

      - name: Upload integration-test images
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-images
          path: docker-images
          retention-days: 1

  integration-tests:
    name: Integration test — ${{ matrix.dataset }}
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dataset:
          - 1patient_1collection

    env:
      DATASET: ${{ matrix.dataset }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download integration-test images
        uses: actions/download-artifact@v5
        with:
          name: integration-test-images
          path: docker-images

      - name: Load integration-test images
        run: |
          docker load \
            --input docker-images/directory-sync-service.tar

          docker load \
            --input docker-images/data-loader.tar

      - name: Run integration stack
        working-directory: ci
        run: |
          set -euo pipefail

          docker compose up -d postgres emx2 store
          docker compose run --rm emx2_init
          docker compose run --rm data-loader
          docker compose run --rm directory_sync_service_file
          docker compose run --rm directory_sync_service_molgenis
          docker compose run --rm emx2_tests

      - name: Compare output with reference data
        working-directory: ci
        run: |
          set -euo pipefail
          bash compare_test_results_with_reference.sh "$DATASET"

      - name: Show Compose logs on failure
        if: failure()
        working-directory: ci
        run: |
          docker compose logs --no-color || true

      - name: Tear down stack
        if: always()
        working-directory: ci
        run: |
          docker compose down -v --remove-orphans || true
          rm -rf output/* || true
          docker volume rm -f store-db-data || true

  publish:
    name: Publish Docker image
    needs:
      - build
      - integration-tests
    runs-on: ubuntu-latest

    # Do not publish images for pull requests.
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: samply/directory_sync_service
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}